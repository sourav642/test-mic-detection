<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Blow Detection</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; margin-top: 20vh; }
        #status { font-size: 1.5rem; margin-top: 20px; font-weight: bold; color: #555; }
        button { padding: 12px 24px; font-size: 1.1rem; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
        button:hover { background: #e0e0e0; }
        .success { color: #4CAF50 !important; }
    </style>
</head>
<body>

    <button id="start-btn">Enable Microphone</button>
    <div id="status">Waiting for permission...</div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');
        
        let audioContext;
        let stream;
        let animationId;
        
        let consecutiveBlowFrames = 0;
        let ambientBass = 0; // Tracks background noise silently

        startBtn.addEventListener('click', async () => {
            try {
                // Ensure raw audio so the browser doesn't block the wind noise
                const audioConstraints = {
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(audioConstraints);
                
                // INSTANT UX: Hide button, show immediate listening state
                startBtn.style.display = 'none';
                statusText.textContent = "Listening... Blow into the mic! 💨";
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const microphone = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                
                analyser.smoothingTimeConstant = 0.2; 
                analyser.fftSize = 256; 
                
                microphone.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function checkVolume() {
                    analyser.getByteFrequencyData(dataArray);

                    const currentBass = dataArray[0]; 
                    const highFreq = dataArray[20]; 

                    // 1. Is it a sudden spike above the invisible background noise?
                    const isSpike = currentBass > (ambientBass + 60);
                    // 2. Is it loud enough to be a deliberate blow?
                    const isLoud = currentBass > 120;
                    // 3. Is it mostly wind? (Bass significantly higher than pitch)
                    const isWind = (currentBass - highFreq) > 50;

                    if (isSpike && isLoud && isWind) {
                        consecutiveBlowFrames++; 
                        
                        // Require ~130ms of continuous blowing
                        if (consecutiveBlowFrames > 8) {
                            triggerSuccess();
                            return; 
                        }
                    } else {
                        consecutiveBlowFrames = 0;
                        
                        // If no blow is happening, constantly update the ambient room noise.
                        // This absorbs fan noise in fractions of a second invisibly.
                        ambientBass = (ambientBass * 0.95) + (currentBass * 0.05);
                    }

                    animationId = requestAnimationFrame(checkVolume);
                }

                checkVolume();

            } catch (err) {
                console.error("Mic error:", err);
                statusText.textContent = "Microphone access denied.";
            }
        });

        function triggerSuccess() {
            statusText.textContent = "🎉 Blow Detected!";
            statusText.classList.add('success');

            cancelAnimationFrame(animationId);
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (audioContext) {
                audioContext.close();
            }
        }
    </script>
</body>
</html>
