<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Audio Blow Detection</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; margin-top: 20vh; }
        #status { font-size: 1.5rem; margin-top: 20px; font-weight: bold; color: #555; }
        #debug { font-family: monospace; color: #888; margin-top: 15px; font-size: 1rem; }
        button { padding: 12px 24px; font-size: 1.1rem; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
        button:hover { background: #e0e0e0; }
        .success { color: #4CAF50 !important; }
    </style>
</head>
<body>

    <button id="start-btn">Enable Microphone</button>
    <div id="status">Waiting for permission...</div>
    <div id="debug"></div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');
        const debugText = document.getElementById('debug');
        
        let audioContext;
        let stream;
        let animationId;
        let consecutiveBlowFrames = 0;

        startBtn.addEventListener('click', async () => {
            try {
                statusText.textContent = "Requesting raw audio permission...";
                
                // CRUCIAL FIX: Tell the browser NOT to filter out wind/background noise
                const audioConstraints = {
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(audioConstraints);
                startBtn.style.display = 'none';
                statusText.textContent = "Listening... Blow into the mic! 💨";

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const microphone = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                
                analyser.smoothingTimeConstant = 0.2; 
                analyser.fftSize = 256; 
                
                microphone.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function checkVolume() {
                    analyser.getByteFrequencyData(dataArray);

                    const lowFreqVolume = dataArray[0]; 
                    const highFreqVolume = dataArray[20]; 

                    // Show live numbers on screen so you can see what the mic hears
                    debugText.textContent = `Live Bass: ${lowFreqVolume} | High pitch: ${highFreqVolume}`;

                    // Relaxed the thresholds slightly in case your mic volume is naturally low
                    if (lowFreqVolume > 130 && (lowFreqVolume - highFreqVolume > 50)) {
                        
                        consecutiveBlowFrames++; 
                        
                        // Lowered to 10 frames (~160ms) so you don't run out of breath
                        if (consecutiveBlowFrames > 10) {
                            triggerSuccess();
                            return; 
                        }
                    } else {
                        consecutiveBlowFrames = 0;
                    }

                    animationId = requestAnimationFrame(checkVolume);
                }

                checkVolume();

            } catch (err) {
                console.error("Mic error:", err);
                statusText.textContent = "Microphone access denied.";
            }
        });

        function triggerSuccess() {
            statusText.textContent = "🎉 Blow Detected! (Mic stopped)";
            statusText.classList.add('success');
            debugText.textContent = "Processing stopped.";

            cancelAnimationFrame(animationId);
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (audioContext) {
                audioContext.close();
            }
        }
    </script>
</body>
</html>
