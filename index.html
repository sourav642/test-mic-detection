<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict Blow Detection</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; margin-top: 20vh; }
        #status { font-size: 1.5rem; margin-top: 20px; font-weight: bold; color: #555; }
        button { padding: 12px 24px; font-size: 1.1rem; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
        button:hover { background: #e0e0e0; }
        .success { color: #4CAF50 !important; }
    </style>
</head>
<body>

    <button id="start-btn">Enable Microphone</button>
    <div id="status">Waiting for permission...</div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');
        
        let audioContext;
        let stream;
        let animationId;
        
        let consecutiveBlowFrames = 0;

        startBtn.addEventListener('click', async () => {
            try {
                // Must disable suppression so the browser doesn't block the clipping
                const audioConstraints = {
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(audioConstraints);
                
                startBtn.style.display = 'none';
                statusText.textContent = "Listening... Give it a SHARP, solid blow! 💨";
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const microphone = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                
                analyser.smoothingTimeConstant = 0.1; // Highly responsive
                analyser.fftSize = 256; 
                
                microphone.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function checkVolume() {
                    analyser.getByteFrequencyData(dataArray);

                    const currentBass = dataArray[0]; // Deep rumble
                    const highFreq = dataArray[20];   // High pitch (voice/noise)

                    // STRICT RULES:
                    // 1. Max volume is 255. A sharp blow must overload the mic (> 230).
                    // 2. High frequencies must stay relatively quiet (< 100), meaning they aren't yelling.
                    const isExtremeClipping = currentBass > 230;
                    const isNotYelling = highFreq < 100;

                    if (isExtremeClipping && isNotYelling) {
                        consecutiveBlowFrames++; 
                        
                        // Require this max-volume state to hold for ~100 milliseconds (6 frames)
                        // This prevents quick pops or hitting the desk from triggering it.
                        if (consecutiveBlowFrames > 6) {
                            triggerSuccess();
                            return; 
                        }
                    } else {
                        // The moment the pressure drops, reset to 0
                        consecutiveBlowFrames = 0;
                    }

                    animationId = requestAnimationFrame(checkVolume);
                }

                checkVolume();

            } catch (err) {
                console.error("Mic error:", err);
                statusText.textContent = "Microphone access denied.";
            }
        });

        function triggerSuccess() {
            statusText.textContent = "🎉 Solid Blow Detected!";
            statusText.classList.add('success');

            cancelAnimationFrame(animationId);
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (audioContext) {
                audioContext.close();
            }
        }
    </script>
</body>
</html>
